<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | Mercado Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar">
        <a class="sidebar-brand" th:href="@{/}">
            <span class="brand-mark">ME</span>
            <span>Mercado Express</span>
        </a>
        <nav class="sidebar-nav">
            <a class="sidebar-link active" th:href="@{/mercado}">Produtos</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-block" sec:authorize="isAuthenticated()">
                <span class="user-label">Usuario</span>
                <span class="user-name" sec:authentication="name">admin</span>
            </div>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline" type="submit">Sair</button>
            </form>
        </div>
    </aside>

    <main class="app-content">
        <div class="page-shell">
    <section class="page-heading">
        <div>
            <p class="eyebrow">Gestao de estoque</p>
            <h1>Produtos</h1>
        </div>
        <a class="btn btn-primary" th:href="@{/mercado/novo}">Novo Produto</a>
    </section>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-error" th:if="${erro}" th:text="${erro}"></div>

    <section class="content-panel" th:if="${#lists.isEmpty(produtos)}">
        <div class="empty-state">
            <h2>Nenhum produto cadastrado</h2>
            <p>Cadastre o primeiro produto para iniciar o controle do Mercado Express.</p>
            <a class="btn btn-primary" th:href="@{/mercado/novo}">Cadastrar Produto</a>
        </div>
    </section>

    <section class="table-panel" th:unless="${#lists.isEmpty(produtos)}">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Setor</th>
                    <th>Tamanho</th>
                    <th>Preco</th>
                    <th>Acoes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="produto : ${produtos}">
                    <td data-label="Nome" th:text="${produto.nome}">Arroz</td>
                    <td data-label="Tipo" th:text="${produto.tipo}">Alimento</td>
                    <td data-label="Setor" th:text="${produto.setor}">Mercearia</td>
                    <td data-label="Tamanho" th:text="${produto.tamanho}">1 kg</td>
                    <td data-label="Preco" th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">R$ 10,00</td>
                    <td data-label="Acoes">
                        <div class="action-row">
                            <a class="btn btn-small btn-ghost" th:href="@{/mercado/{id}(id=${produto.id})}">Ver</a>
                            <a class="btn btn-small btn-secondary" th:href="@{/mercado/{id}/editar(id=${produto.id})}">Editar</a>
                            <form th:action="@{/mercado/{id}(id=${produto.id})}" method="post" class="inline-form"
                                  onsubmit="return confirm('Tem certeza que deseja excluir este produto?');">
                                <input type="hidden" name="_method" value="delete">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-small btn-danger" type="submit">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
        </div>
    </main>
</div>
</body>
</html>
