<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${modoEdicao} ? 'Editar Produto | Mercado Express' : 'Novo Produto | Mercado Express'">Produto | Mercado Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar">
        <a class="sidebar-brand" th:href="@{/}">
            <span class="brand-mark">ME</span>
            <span>Mercado Express</span>
        </a>
        <nav class="sidebar-nav">
            <a class="sidebar-link active" th:href="@{/mercado}">Produtos</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-block" sec:authorize="isAuthenticated()">
                <span class="user-label">Usuario</span>
                <span class="user-name" sec:authentication="name">admin</span>
            </div>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline" type="submit">Sair</button>
            </form>
        </div>
    </aside>

    <main class="app-content">
        <div class="page-shell narrow">
    <section class="page-heading">
        <div>
            <p class="eyebrow" th:text="${modoEdicao} ? 'Atualizacao de cadastro' : 'Novo cadastro'">Cadastro</p>
            <h1 th:text="${modoEdicao} ? 'Editar produto' : 'Novo produto'">Produto</h1>
        </div>
        <a class="btn btn-secondary" th:href="@{/mercado}">Voltar</a>
    </section>

    <form class="form-card" th:object="${mercado}"
          th:action="${modoEdicao} ? @{/mercado/{id}(id=${mercado.id})} : @{/mercado}"
          method="post">
        <input type="hidden" th:if="${modoEdicao}" name="_method" value="put">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label class="field">
            <span>Nome</span>
            <input type="text" th:field="*{nome}" maxlength="120" placeholder="Ex.: Cafe especial">
            <small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</small>
        </label>

        <div class="form-grid">
            <label class="field">
                <span>Tipo</span>
                <input type="text" th:field="*{tipo}" maxlength="50" placeholder="Ex.: Bebida">
                <small class="field-error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}">Erro</small>
            </label>

            <label class="field">
                <span>Setor</span>
                <input type="text" th:field="*{setor}" maxlength="80" placeholder="Ex.: Mercearia">
                <small class="field-error" th:if="${#fields.hasErrors('setor')}" th:errors="*{setor}">Erro</small>
            </label>
        </div>

        <div class="form-grid">
            <label class="field">
                <span>Tamanho</span>
                <input type="text" th:field="*{tamanho}" maxlength="40" placeholder="Ex.: 500 g">
                <small class="field-error" th:if="${#fields.hasErrors('tamanho')}" th:errors="*{tamanho}">Erro</small>
            </label>

            <label class="field">
                <span>Preco</span>
                <input type="number" th:field="*{preco}" min="0.01" step="0.01" placeholder="0,00">
                <small class="field-error" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}">Erro</small>
            </label>
        </div>

        <div class="form-actions">
            <a class="btn btn-secondary" th:href="@{/mercado}">Cancelar</a>
            <button class="btn btn-primary" type="submit" th:text="${modoEdicao} ? 'Salvar alteracoes' : 'Cadastrar produto'">Salvar</button>
        </div>
    </form>
        </div>
    </main>
</div>
</body>
</html>
