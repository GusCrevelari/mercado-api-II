<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto nao encontrado | Mercado Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="app-header">
    <nav class="nav-shell">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">ME</span>
            <span>Mercado Express</span>
        </a>
        <div class="nav-actions">
            <a class="nav-link" th:href="@{/mercado}">Produtos</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline" type="submit">Sair</button>
            </form>
        </div>
    </nav>
</header>

<main class="page-shell narrow">
    <section class="content-panel">
        <div class="empty-state">
            <p class="eyebrow">404</p>
            <h1 th:text="${mensagem}">Produto nao encontrado.</h1>
            <p>O produto solicitado nao existe ou ja foi removido.</p>
            <a class="btn btn-primary" th:href="@{/mercado}">Voltar para produtos</a>
        </div>
    </section>
</main>
</body>
</html>
