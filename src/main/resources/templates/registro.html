<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Mercado Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<header class="app-header">
    <nav class="nav-shell">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">ME</span>
            <span>Mercado Express</span>
        </a>
        <div class="nav-actions">
            <a class="nav-link" th:href="@{/login}">Login</a>
        </div>
    </nav>
</header>

<main class="auth-shell">
    <section class="auth-panel">
        <div class="auth-intro">
            <p class="eyebrow">Nova conta</p>
            <h1>Cadastre-se</h1>
            <p>Toda conta criada por esta pagina recebe o perfil Cliente.</p>
        </div>

        <form class="form-card" th:action="@{/registro}" th:object="${usuario}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label class="field">
                <span>Nome</span>
                <input type="text" th:field="*{nome}" maxlength="120" autocomplete="name" required>
                <small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</small>
            </label>

            <label class="field">
                <span>Usuario</span>
                <input type="text" th:field="*{login}" minlength="3" maxlength="100" autocomplete="username" required>
                <small class="field-error" th:if="${#fields.hasErrors('login')}" th:errors="*{login}">Erro</small>
            </label>

            <label class="field">
                <span>Senha</span>
                <input type="password" th:field="*{senha}" minlength="8" maxlength="72" autocomplete="new-password" required>
                <small class="field-error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">Erro</small>
            </label>

            <label class="field">
                <span>Confirmar senha</span>
                <input type="password" th:field="*{confirmacaoSenha}" minlength="8" maxlength="72" autocomplete="new-password" required>
                <small class="field-error" th:if="${#fields.hasErrors('confirmacaoSenha')}"
                       th:errors="*{confirmacaoSenha}">Erro</small>
                <small class="field-error" th:if="${#fields.hasErrors('senhaConfirmada')}"
                       th:errors="*{senhaConfirmada}">Erro</small>
            </label>

            <button class="btn btn-primary btn-full" type="submit">Criar conta</button>
        </form>

        <p class="auth-alternative">
            Ja possui uma conta? <a th:href="@{/login}">Entrar</a>
        </p>
    </section>
</main>
</body>
</html>
