spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# The legacy Oracle schema contains only the existing product table. Validation is
# disabled so the PostgreSQL-only CP5 user entity does not alter or block it.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

app.security.username=${APP_USERNAME}
app.security.password=${APP_PASSWORD}
