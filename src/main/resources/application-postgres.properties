spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

# Optional one-time bootstrap. When both values are present, an ADMIN is created
# only if the normalized login does not already exist.
app.security.admin.username=${APP_ADMIN_USERNAME:}
app.security.admin.password=${APP_ADMIN_PASSWORD:}
app.security.admin.name=${APP_ADMIN_NAME:Administrador}
