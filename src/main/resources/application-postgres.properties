spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

# Optional one-time bootstrap. When both values are present, an ADMIN is created
# only if the normalized login does not already exist.
app.security.admin.username=${APP_ADMIN_USERNAME:}
app.security.admin.password=${APP_ADMIN_PASSWORD:}
app.security.admin.name=${APP_ADMIN_NAME:Administrador}

# RabbitMQ payment integration. Publisher confirms keep an outbox row pending
# until the broker has acknowledged the durable message.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=true
spring.rabbitmq.listener.simple.auto-startup=${PAYMENT_RESULT_LISTENER_ENABLED:true}

app.payment.publisher-confirm-timeout=${PAYMENT_PUBLISH_CONFIRM_TIMEOUT:5s}
app.payment.outbox.enabled=${PAYMENT_OUTBOX_ENABLED:true}
app.payment.outbox.delay=${PAYMENT_OUTBOX_DELAY:1s}

# Local transport captures email in Mailpit. Render can select https-api later;
# no external provider endpoint or credential is included in this repository.
app.notification.email.enabled=${EMAIL_NOTIFICATION_ENABLED:true}
app.notification.email.transport=${EMAIL_TRANSPORT:smtp}
app.notification.email.from=${EMAIL_FROM:no-reply@mercado.local}
app.notification.email.max-attempts=${EMAIL_MAX_ATTEMPTS:3}
app.notification.email.delay=${EMAIL_RETRY_DELAY:2s}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:3000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}

app.notification.email.https-api.endpoint=${EMAIL_API_URL:}
app.notification.email.https-api.token=${EMAIL_API_TOKEN:}
app.notification.email.https-api.timeout=${EMAIL_API_TIMEOUT:5s}
app.notification.email.https-api.from=${EMAIL_FROM:no-reply@mercado.local}
