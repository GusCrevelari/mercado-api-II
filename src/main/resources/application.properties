spring.application.name=mercado-mvc
server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.hiddenmethod.filter.enabled=true

# Demo credentials for local academic validation. Override with APP_USERNAME and APP_PASSWORD.
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:fiap123}
